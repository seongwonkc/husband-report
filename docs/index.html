<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>남편은 오늘 뭐 했어?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<style>
  :root{
    --bg:#faf7f2; --card:#fffdfa; --ink:#2a2521; --muted:#7b7168; --faint:#a99f95;
    --line:#e9e0d5; --accent:#a9793f; --accent-soft:#f3e7d6; --good:#4f7a52; --warn:#b06a3b;
    --shadow:0 1px 2px rgba(60,45,25,.05), 0 6px 20px rgba(60,45,25,.05);
    --radius:16px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17161a; --card:#1e1d22; --ink:#eee9e2; --muted:#a29a91; --faint:#736c65;
      --line:#302e35; --accent:#d9a86a; --accent-soft:#332a1e; --good:#84b189; --warn:#d69a6a;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
                "맑은 고딕","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    line-height:1.75; letter-spacing:-.01em;
    padding:0 20px 80px; word-break:keep-all; overflow-wrap:anywhere;
  }
  .wrap{max-width:680px; margin:0 auto}

  /* ── 머리말 ───────────────────────────── */
  header{padding:44px 0 8px; text-align:center}
  h1{
    margin:0; font-size:clamp(26px,6.4vw,36px); font-weight:800; letter-spacing:-.035em;
  }
  h1 .em{color:var(--accent)}
  .tagline{margin:8px 0 0; color:var(--muted); font-size:14px}

  /* ── 날짜 이동 ─────────────────────────── */
  .datebar{
    display:flex; align-items:center; gap:8px; justify-content:center;
    margin:26px 0 22px;
  }
  .nav{
    flex:0 0 auto; width:42px; height:42px; border-radius:12px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-size:17px; line-height:1; display:grid; place-items:center;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .nav:hover:not(:disabled){background:var(--accent-soft); border-color:var(--accent)}
  .nav:active:not(:disabled){transform:scale(.94)}
  .nav:disabled{opacity:.28; cursor:default}
  .today{
    flex:1 1 auto; text-align:center; border:1px solid var(--line); background:var(--card);
    border-radius:12px; padding:7px 12px; min-width:0; box-shadow:var(--shadow);
  }
  .today .d{font-size:17px; font-weight:700; letter-spacing:-.02em}
  .today .w{font-size:12px; color:var(--muted); margin-top:-2px}
  .today select{
    position:absolute; opacity:0; inset:0; width:100%; height:100%; cursor:pointer;
  }
  .today{position:relative}

  /* ── 요약 카드 ─────────────────────────── */
  .hero{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px 24px 20px; margin-bottom:16px;
  }
  .hero p{
    margin:0; font-size:clamp(17px,4.2vw,20px); font-weight:600; line-height:1.7;
    letter-spacing:-.02em;
  }
  .hero .sub{
    margin-top:10px; font-size:14.5px; font-weight:400; color:var(--muted); line-height:1.7;
  }

  /* 하루 시간 띠 */
  .clock{margin:22px 0 4px}
  .track{
    position:relative; height:9px; border-radius:99px; background:var(--accent-soft);
    overflow:hidden;
  }
  .track .span{
    position:absolute; top:0; bottom:0; background:var(--accent); opacity:.32; border-radius:99px;
  }
  .track .tick{
    position:absolute; top:-3px; width:3px; height:15px; border-radius:99px;
    background:var(--accent); transform:translateX(-1.5px);
  }
  .clock .labels{
    display:flex; justify-content:space-between; font-size:11px; color:var(--faint);
    margin-top:6px; font-variant-numeric:tabular-nums;
  }

  .stats{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;
    padding-top:16px; border-top:1px solid var(--line);
  }
  .stat{
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:6px 11px; font-size:13px; color:var(--muted); white-space:nowrap;
  }
  .stat b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}

  /* ── 프로젝트 카드 ──────────────────────── */
  .sec{
    margin:30px 0 12px; font-size:12.5px; font-weight:700; color:var(--faint);
    letter-spacing:.06em;
  }
  .proj{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px 24px; margin-bottom:12px;
  }
  .proj h2{
    margin:0; font-size:17.5px; font-weight:750; letter-spacing:-.025em;
    display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  }
  .proj h2 .note{font-size:12.5px; font-weight:500; color:var(--faint); letter-spacing:0}
  .proj .body{margin:11px 0 0; font-size:15.5px; line-height:1.8}
  .proj ul{margin:12px 0 0; padding-left:0; list-style:none}
  .proj li{
    position:relative; padding-left:19px; font-size:14.5px; line-height:1.72;
    color:var(--muted); margin-bottom:5px;
  }
  .proj li::before{
    content:""; position:absolute; left:3px; top:.72em; width:5px; height:5px;
    border-radius:99px; background:var(--accent); opacity:.55;
  }
  .meta{
    display:flex; flex-wrap:wrap; gap:7px; align-items:center;
    margin-top:15px; font-size:12.5px; color:var(--faint);
  }
  .chip{
    background:var(--bg); border:1px solid var(--line); border-radius:99px;
    padding:2.5px 10px; font-variant-numeric:tabular-nums;
  }
  .chip.up{color:var(--warn); border-color:currentColor; opacity:.9}

  details{margin-top:14px; border-top:1px solid var(--line); padding-top:11px}
  summary{
    cursor:pointer; font-size:12.5px; color:var(--faint); list-style:none;
    display:inline-flex; align-items:center; gap:6px; user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸"; font-size:10px; transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  summary:hover{color:var(--accent)}
  .tech{margin-top:11px; font-size:12.5px}
  .tech .row{
    display:grid; grid-template-columns:46px 1fr; gap:9px; padding:6px 0;
    border-bottom:1px dashed var(--line); align-items:baseline;
  }
  .tech .row:last-child{border-bottom:0}
  .tech time{color:var(--faint); font-variant-numeric:tabular-nums}
  .tech .s{
    font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
    font-size:11.5px; line-height:1.6; color:var(--muted); word-break:break-word;
  }
  .tech .n{color:var(--faint); font-size:11px; white-space:nowrap}

  /* ── 빈 날 / 안내 ──────────────────────── */
  .empty{
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:52px 24px; text-align:center; color:var(--muted);
  }
  .empty .big{font-size:40px; margin-bottom:12px}
  .empty p{margin:0; font-size:15.5px}
  .pending{
    font-size:13.5px; color:var(--warn); background:var(--accent-soft);
    border-radius:9px; padding:9px 12px; margin-top:11px;
  }
  footer{
    text-align:center; margin-top:40px; font-size:11.5px; color:var(--faint); line-height:1.9;
  }
  @media (max-width:520px){
    body{padding:0 14px 60px}
    .hero,.proj{padding:20px 18px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>남편은 오늘 <span class="em">뭐 했어?</span></h1>
    <p class="tagline">컴퓨터 앞에서 하루 종일 뭘 했는지, 사람 말로 정리한 기록</p>
  </header>

  <div class="datebar">
    <button class="nav" id="prev" aria-label="이전 날">←</button>
    <div class="today">
      <div class="d" id="dLabel">—</div>
      <div class="w" id="wLabel"></div>
      <select id="picker" aria-label="날짜 고르기"></select>
    </div>
    <button class="nav" id="next" aria-label="다음 날">→</button>
  </div>

  <main id="main"></main>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";

  var DATA  = (window.REPORT && window.REPORT.days) || [];
  var GEN   = (window.REPORT && window.REPORT.generated) || "";
  var main  = document.getElementById("main");
  var idx   = DATA.length - 1;

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function fmtDate(iso){
    var p = iso.split("-");
    return p[0] + "년 " + (+p[1]) + "월 " + (+p[2]) + "일";
  }
  function shortDate(iso){
    var p = iso.split("-");
    return (+p[1]) + "월 " + (+p[2]) + "일";
  }
  function mins(hhmm){
    var p = hhmm.split(":");
    return (+p[0]) * 60 + (+p[1]);
  }

  /* 하루 동안 언제 일했는지 보여 주는 띠 (오전 6시 ~ 새벽 2시) */
  function clock(times){
    if(!times || !times.length) return "";
    var START = 6 * 60, END = 26 * 60;              // 06:00 → 다음날 02:00
    function pos(m){
      if(m < START) m += 24 * 60;                   // 새벽은 뒤쪽으로
      return Math.max(0, Math.min(100, (m - START) / (END - START) * 100));
    }
    var ps = times.map(function(t){ return pos(mins(t)); });
    var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
    var ticks = ps.map(function(p){
      return '<i class="tick" style="left:' + p.toFixed(2) + '%"></i>';
    }).join("");
    return '<div class="clock">' +
             '<div class="track">' +
               '<i class="span" style="left:' + lo.toFixed(2) + '%;width:' +
                  Math.max(0.6, hi - lo).toFixed(2) + '%"></i>' + ticks +
             '</div>' +
             '<div class="labels"><span>아침 6시</span><span>낮 12시</span>' +
             '<span>저녁 6시</span><span>밤 12시</span></div>' +
           '</div>';
  }

  function statChips(s){
    var out = [];
    out.push('<span class="stat">작업 <b>' + s.commits + '</b>건</span>');
    out.push('<span class="stat">프로젝트 <b>' + s.projects + '</b>개</span>');
    if(s.first) out.push('<span class="stat"><b>' + s.first + '</b> ~ <b>' + s.last + '</b></span>');
    if(s.files) out.push('<span class="stat">고친 파일 <b>' + s.files + '</b>개</span>');
    if(s.unpushed) out.push('<span class="stat">아직 안 올린 작업 <b>' + s.unpushed + '</b>건</span>');
    return '<div class="stats">' + out.join("") + '</div>';
  }

  function projectCard(p){
    var h = '<article class="proj">';
    h += '<h2>' + esc(p.ko) + (p.note ? '<span class="note">' + esc(p.note) + '</span>' : '') + '</h2>';

    if(p.summary){
      h += '<p class="body">' + esc(p.summary) + '</p>';
    } else {
      h += '<p class="pending">아직 사람 말로 정리하지 않은 작업이에요. ' +
           '아래 &lsquo;기술적인 내용&rsquo;에 원본이 그대로 들어 있습니다.</p>';
    }

    if(p.bullets && p.bullets.length){
      h += '<ul>' + p.bullets.map(function(b){
        return '<li>' + esc(b) + '</li>';
      }).join("") + '</ul>';
    }

    h += '<div class="meta">';
    h += '<span class="chip">' + p.from + ' ~ ' + p.to + '</span>';
    h += '<span class="chip">작업 ' + p.count + '건</span>';
    if(p.files) h += '<span class="chip">파일 ' + p.files + '개</span>';
    if(p.unpushed) h += '<span class="chip up">아직 안 올림 ' + p.unpushed + '건</span>';
    h += '</div>';

    if(p.tech && p.tech.length){
      h += '<details><summary>기술적인 내용 보기 (' + p.tech.length + '건)</summary><div class="tech">';
      h += p.tech.map(function(c){
        return '<div class="row"><time>' + c.t + '</time>' +
               '<div><div class="s">' + esc(c.s) + '</div>' +
               '<div class="n">파일 ' + c.f + '개 · +' + c.a + ' / −' + c.r +
               (c.p ? '' : ' · 아직 GitHub 에 안 올림') + '</div></div></div>';
      }).join("");
      h += '</div></details>';
    }
    return h + '</article>';
  }

  function render(){
    if(!DATA.length){
      main.innerHTML = '<div class="empty"><div class="big">🌱</div>' +
        '<p>아직 기록이 없어요.<br><code>python report.py collect</code> 부터 실행해 보세요.</p></div>';
      document.getElementById("dLabel").textContent = "기록 없음";
      return;
    }

    var d = DATA[idx];
    document.getElementById("dLabel").textContent = fmtDate(d.date);
    document.getElementById("wLabel").textContent = d.weekday;
    document.getElementById("picker").value = d.date;
    document.getElementById("prev").disabled = (idx <= 0);
    document.getElementById("next").disabled = (idx >= DATA.length - 1);

    if(!d.stats.commits){
      main.innerHTML = '<div class="empty"><div class="big">☕</div>' +
        '<p>' + esc(d.headline || "이 날은 코딩 기록이 없네요. 쉬었거나, 컴퓨터 밖에서 일한 날이에요.") +
        '</p></div>';
      return;
    }

    var h = '<section class="hero">';
    h += '<p>' + esc(d.headline || (d.stats.projects + "개 프로젝트에서 " +
                                    d.stats.commits + "건을 작업했어요.")) + '</p>';
    if(d.note) h += '<p class="sub">' + esc(d.note) + '</p>';
    h += clock(d.times);
    h += statChips(d.stats);
    h += '</section>';

    h += '<div class="sec">오늘 손댄 것들</div>';
    h += d.projects.map(projectCard).join("");
    main.innerHTML = h;
  }

  /* 주소창에 날짜를 남겨 특정 날짜를 즐겨찾기 할 수 있게 (#2026-08-13) */
  function show(i, push){
    idx = Math.max(0, Math.min(DATA.length - 1, i));
    render();
    if(push && DATA[idx]){
      var hash = "#" + DATA[idx].date;
      if(location.hash !== hash) history.replaceState(null, "", hash);
    }
  }
  function fromHash(){
    var want = (location.hash || "").replace("#", "");
    for(var i = 0; i < DATA.length; i++){ if(DATA[i].date === want) return i; }
    return DATA.length - 1;
  }

  /* 날짜 고르기 목록 */
  var picker = document.getElementById("picker");
  picker.innerHTML = DATA.map(function(d){
    return '<option value="' + d.date + '">' + shortDate(d.date) + " " +
           d.weekday + " · 작업 " + d.stats.commits + "건</option>";
  }).join("");
  picker.addEventListener("change", function(){
    for(var i = 0; i < DATA.length; i++){
      if(DATA[i].date === picker.value){ show(i, true); return; }
    }
  });

  document.getElementById("prev").addEventListener("click", function(){ show(idx - 1, true); });
  document.getElementById("next").addEventListener("click", function(){ show(idx + 1, true); });
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft")  show(idx - 1, true);
    if(e.key === "ArrowRight") show(idx + 1, true);
  });
  window.addEventListener("hashchange", function(){ show(fromHash(), false); });

  document.getElementById("foot").innerHTML =
    "이 페이지는 남편 컴퓨터의 작업 기록에서 자동으로 만들어집니다." +
    (GEN ? "<br>마지막 업데이트 " + esc(GEN) : "");

  show(fromHash(), false);
})();
</script>
</body>
</html>
